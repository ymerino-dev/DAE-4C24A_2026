<article class="article-card">
  {% if article.featured_image %}
    <img class="card-image" src="{{ article.featured_image.url }}"
         alt="Featured image of {{ article.title }}" loading="lazy">
  {% else %}
    <div class="card-placeholder">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#718096" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <line x1="9" y1="9" x2="9.01" y2="9.01"/>
        <line x1="15" y1="9" x2="15.01" y2="9.01"/>
        <line x1="9" y1="15" x2="9.01" y2="15.01"/>
        <line x1="15" y1="15" x2="15.01" y2="15.01"/>
      </svg>
      <span>Sin imagen</span>
    </div>
  {% endif %}

  <div class="card-body">
    <h2 class="card-title">
      <a href="{% url 'news:article_detail' article.slug %}">{{ article.title }}</a>
    </h2>

    <p class="card-meta">
      By {{ article.author.name }} &middot;
      {{ article.published_at|date:"d/m/Y H:i" }}
    </p>

    <p class="card-excerpt">{{ article.body|truncatewords:20 }}</p>

    <ul class="tag-list">
      {% for category in article.categories.all %}
        <li><a class="tag" href="{% url 'news:category_detail' category.slug %}">{{ category.name }}</a></li>
      {% endfor %}
    </ul>
  </div>
</article>
